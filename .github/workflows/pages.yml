name: Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.170.1'

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Hugo
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          checksums="hugo_${HUGO_VERSION}_checksums.txt"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --retry 3 -fsSLO "$url/$archive"
          curl --retry 3 -fsSLO "$url/$checksums"
          sha256sum --check --ignore-missing "$checksums"
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo" hugo
          printf '%s\n' "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test

      - name: Read Pages settings
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build production site
        shell: bash
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          args=(--gc --minify --panicOnWarning)
          if [[ -n "$PAGES_URL" ]]; then
            args+=(--baseURL "${PAGES_URL%/}/")
          fi
          hugo "${args[@]}"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
