{{ define "main" }}
<section class="home-hero">
  <div class="home-copy">
    <h1>读书笔记</h1>
    <div class="intro">{{ .Content }}</div>
    {{ with site.GetPage "/notes" }}<a class="button button--primary button--lg" href="{{ .RelPermalink }}">浏览读书笔记 <span aria-hidden="true">→</span></a>{{ end }}
  </div>
  {{ with site.GetPage "/notes/vibe-coding/oil-book" }}
  <a class="card card--default feature" href="{{ .RelPermalink }}">
    <img src="{{ "images/reading-desk.webp" | relURL }}" alt="" width="1200" height="900" fetchpriority="high">
    <span class="card__header feature-caption">
      <span class="feature-copy">
        <span class="feature-series">Vibe Coding</span>
        <span class="card__title">{{ .Title }}</span>
      </span>
      <span class="card-arrow" aria-hidden="true">→</span>
    </span>
  </a>
  {{ end }}
</section>
<section class="home-sections" aria-labelledby="sections-title">
  <h2 id="sections-title">栏目</h2>
  {{ partial "page-list.html" site.Sections.ByWeight }}
</section>
{{ end }}
