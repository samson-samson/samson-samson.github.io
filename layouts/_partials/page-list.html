<ul class="page-list">
  {{ range . }}
  <li>
    <a class="card card--default page-list-card" href="{{ .RelPermalink }}">
      <span class="card__header page-list-copy">
        <span class="card__title">{{ .Title }}</span>
        {{ with .Description }}<span class="card__description">{{ . }}</span>{{ end }}
      </span>
      <span class="card-arrow" aria-hidden="true">→</span>
    </a>
  </li>
  {{ end }}
</ul>
